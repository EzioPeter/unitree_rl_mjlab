seed: 0
dataset_path: logs/rwm_datasets/go2_flat_mixed_safety_command_coverage_200k_from1m/dataset.pt
save_dir: logs/rsl_rl/go2_flat_rwm_offline_mixed_safety_command_coverage_200k_proprioceptive
max_iterations: 5000
batch_size: 1024
micro_batch_size: 256
learning_rate: 0.0001
weight_decay: 0.00001
save_interval: 500
log_interval: 50
train_fraction: 0.8
device: cuda:0
action_mask_indices: []
masked_joint_names: []
policy_observation_mask_indices: []

system_dynamics:
  model_type: go2_proprioceptive
  input_state_dim: 42
  output_state_dim: 45
  action_dim: 12
  full_state_dim: 45
  full_action_dim: 12
  dropped_state_indices: [0, 1, 2]
  output_dropped_state_indices: []
  dropped_action_indices: []
  ensemble_size: 5
  history_horizon: 32
  forecast_horizon: 8
  hidden_size: 256
  num_layers: 2
  loss_mode: reference_autoregressive_mse
  state_loss_weight: 1.0
  sequence_loss_weight: 1.0
  bound_loss_weight: 1.0
  kl_loss_weight: 0.1
  extension_loss_weight: 1.0
  contact_loss_weight: 1.0
  termination_loss_weight: 1.0
