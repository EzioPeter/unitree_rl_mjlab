      [0.0, 1.36, -2.65, 0.0, 1.36, -2.65, 0.0, 1.36, -2.65, 0.0, 1.36, -2.65],
    ]
  Velocity_Up:
    transitions:
      Passive: LT + B.on_pressed
      FixSquat: LT + A.on_pressed
      Velocity_Down: start + down
      Velocity_Left: start + left
      Velocity_Right: start + right
    policy_dir: ../../../logs/go2/g0_d0_rrcalf_0p5
    logging: true
    logging_dt: 0.02
    fixed_command:
      enabled: true
      lin_vel_x: 1.0
      lin_vel_y: 0.0
      ang_vel_z: 0.0
